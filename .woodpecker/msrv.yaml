# The Rust the Docker image builds with (see the Dockerfile).
when:
  - event: push
    branch: main
  - event: [pull_request, manual]

# Only on agents set aside for tests (WOODPECKER_AGENT_LABELS=test-runner=true).
labels:
  test-runner: "true"

steps:
  - name: builds-with-rust-1.88
    image: rust:1.88-bookworm
    environment:
      CARGO_TERM_COLOR: always
    commands:
      - cargo check --locked --all-targets
